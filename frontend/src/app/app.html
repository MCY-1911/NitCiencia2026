<app-header></app-header>

<main class="mx-auto max-w-7xl p-6">

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-[2fr_1fr]">

    <!-- Imagen principal / Visor en tiempo real -->
    <app-image-viewer [imageUrl]="currentImageUrl()" [liveImageUrl]="liveImageUrl()"
      (tabChange)="onViewerTabChange($event)" />

    <!-- Selección de clase -->
    @if (viewerTab() === 'captures') {
      <div class="flex h-full items-center">
        <app-class-selector [classes]="classes()" (selected)="onClassSelected($event)" class="w-full" [disabled]="!currentCapture()"/>
      </div>
    }

  </div>

  <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-[2fr_1fr]">

    <!-- Columna izquierda -->
    <div class="flex flex-col gap-6">

      @if (viewerTab() === 'captures') {

      <!-- Capturas pendientes -->
      <app-capture-carousel [captures]="captures()" [selectedCapture]="currentCapture()"
        (selected)="onCaptureSelected($event)" />

      <!-- Entrenamiento -->
      <div class="flex justify-center">
        <p-button label="Entrenar Modelo" severity="info" size="large" [raised]="true"
          styleClass="w-full max-w-md justify-center py-3 text-lg font-semibold" (onClick)="openTrainingDialog()" />
      </div>

      }

    </div>

    <!-- Conteo del dataset -->
    <app-dataset-panel [stats]="datasetStats()" [classes]="classes()" />

  </div>

</main>

<app-training-dialog [visible]="trainingDialogVisible()" [state]="trainingState()" [progress]="trainingProgress()"
  [status]="trainingStatus()" (visibleChange)="trainingDialogVisible.set($event)" (startTraining)="onStartTraining()" />
