<app-header></app-header>

<main class="mx-auto max-w-7xl p-6">

  <div class="grid grid-cols-1 gap-6 lg:grid-cols-[2fr_1fr]">

    <!-- Imagen principal -->
    <app-image-viewer [imageUrl]="currentImageUrl()" />

    <!-- Dataset -->
    <app-dataset-panel [stats]="datasetStats()" [classes]="classes()" />

  </div>


  <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-[2fr_1fr]">

    <!-- Columna izquierda -->
    <div class="flex flex-col gap-6">

      <!-- Capturas pendientes -->
      <app-capture-carousel [captures]="captures()" (selected)="onCaptureSelected($event)" />

      <!-- Entrenamiento -->
      <div class="flex justify-center">
        <p-button label="Entrenar Modelo" severity="info" size="large" [raised]="true"
          styleClass="w-full max-w-md justify-center py-3 text-lg font-semibold" (onClick)="openTrainingDialog()" />
      </div>

    </div>

    <!-- Selección de clase -->
    <app-class-selector [classes]="classes()" (selected)="onClassSelected($event)" />

  </div>

</main>

<app-training-dialog [visible]="trainingDialogVisible()" [state]="trainingState()" [progress]="trainingProgress()"
  [status]="trainingStatus()" (visibleChange)="trainingDialogVisible.set($event)" (startTraining)="onStartTraining()" />
