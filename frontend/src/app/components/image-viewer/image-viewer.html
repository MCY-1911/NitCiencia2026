<div class="flex h-full flex-col rounded-xl border border-surface-200 bg-surface-0 p-4 shadow-sm">

    <h2 class="mb-3 text-xl font-semibold">
        Vista en directe
    </h2>

    <div class="flex min-h-0 flex-1 items-center justify-center overflow-hidden rounded-xl bg-surface-900">
        @if (liveImageUrl) {
        <img [src]="liveImageUrl" alt="Vista en directe" class="h-full w-full object-contain">
        } @else {
        <div class="text-center text-surface-400">
            Esperando imagen de la cámara...
        </div>
        }
    </div>

</div>
