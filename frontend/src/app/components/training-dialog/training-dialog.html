<p-dialog header="Entrenar Modelo" [modal]="true" [visible]="visible" (visibleChange)="visibleChange.emit($event)"
    [closable]="false" [style]="{ width: '32rem' }">
    @if (!training) {
        <div class="flex flex-col gap-5">
            <div>
                <p class="font-medium">
                    ¿Quieres comenzar el entrenamiento?
                </p>
                <p class="mt-2 text-sm text-surface-500">
                    El modelo aprenderá a reconocer los objetos utilizando las imágenes que has etiquetado.
                </p>
            </div>
            <div class="flex justify-end gap-3">
                <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
                <p-button label="Empezar entrenamiento" severity="info" (onClick)="start()" />
            </div>
        </div>
    } @else {
        <div class="flex flex-col gap-5">
            <p class="font-medium">
                {{ status }}
            </p>
            <p-progressbar [value]="progress" [showValue]="true" />
        </div>
    }
</p-dialog>
