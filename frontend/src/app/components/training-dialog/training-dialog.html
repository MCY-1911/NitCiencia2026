<p-button label="Entrenar modelo" icon="pi pi-play" (onClick)="open()" />

<p-dialog header="Entrenamiento del modelo" [modal]="true" [visible]="visible()" (visibleChange)="visible.set($event)"
    [closable]="true" [style]="{ width: '32rem' }">

    <div class="flex flex-col gap-5">

        <div>
            <p class="font-medium">
                {{ status() }}
            </p>

            <p class="mt-1 text-sm text-surface-500">
                El modelo aprenderá a reconocer los objetos utilizando las imágenes etiquetadas.
            </p>
        </div>

        <p-progressbar [value]="progress()" [showValue]="true" />

    </div>

</p-dialog>
