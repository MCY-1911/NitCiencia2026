@if (captures.length > 0) {
    <p-carousel [value]="captures" [numVisible]="numVisible" [numScroll]="1" [showNavigators]="showNavigators">
        <ng-template #item let-capture>
            <button
                class="mx-2 cursor-pointer overflow-hidden rounded-xl border border-surface-200 bg-surface-0 shadow-sm transition hover:shadow-md"
                (click)="selectCapture(capture)">
                <img [src]="capture.image_url" alt="Captura pendiente" class="h-28 w-40 object-cover">
            </button>
        </ng-template>
    </p-carousel>
} @else {
    <div class="rounded-xl border border-dashed border-surface-300 p-6 text-center text-surface-500">
        No hay capturas pendientes
    </div>
}
